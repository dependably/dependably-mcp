# CI/CD pipeline for dependably-mcp
#
# Flow:  test  →  build  →  sbom  →  sbom-publish  →  publish (manual, tag-driven)
#                                                      publish-dev (manual, main)
#
#   Releases are TAG-DRIVEN: push a `vX.Y.Z` tag on main and the `publish` job
#   appears as a manual gate on that tag's pipeline. It does NOT run on the
#   default-branch pipeline — that's what guarantees the release tag exists
#   and prevents a main pipeline and its tag pipeline from both publishing the
#   same version. Mirrors the checker-npm (@dependably/npm-check) pipeline.
#
#   test          `npm test` (tsc build + scripts/smoke.mjs in-memory tool-surface check)
#                 on every push/MR
#   npm-check     audits package-lock.json with our own dogfooded checker
#                 (@dependably/npm-check)
#   sonarqube-check  SonarQube scan on main (advisory, needs SONAR_TOKEN)
#   build         `npm run build && npm pack` the publishable tarball, plus
#                 `npm run bundle:verify` for the Claude Desktop extension
#                 (dist-mcpb/*.mcpb + .sha256); both kept as job artifacts
#   sbom          sbom-reach generate mode: CycloneDX SBOM + reachability SARIF
#                 (every pipeline), kept as artifacts
#   sbom-publish  upload the SBOM to Dependency-Track on the default branch (its
#                 own stage so it never races the `sbom` job in the shared build
#                 dir)
#   sbom-publish-dependably  upload the SBOM and SARIF to the Dependably
#                 instance's Projects (PUT /api/v1/sbom, /api/v1/sarif) on main
#   publish       manual gate on a vX.Y.Z tag — pushes the built tarball to the
#                 private dependably (dogfood) registry
#   release       automatic on a vX.Y.Z tag — GitLab release whose assets link
#                 to the .mcpb bundle and checksum from that tag's build job
#   publish:github manual on main or a vX.Y.Z tag — mirrors the commit (and tag)
#                 to github.com/dependably/dependably-mcp, whose own workflow
#                 publishes to public npm and attaches the bundle to the release
#   publish-dev   manual gate on the default branch — pushes an internal-testing
#                 prerelease (<version>-dev.<iid>.<sha>, dist-tag `dev`) to the
#                 same private registry
#
# All npm installs route through the private dependably registry (like every
# other Dependably repo's CI) rather than the public registry: package-lock.json
# resolves against dependably.northwardlabs.ca (see root .npmrc, and dev
# machines that dogfood the instance as their default npm registry), so a
# pipeline without these credentials 401s on ordinary installs, not just
# @dependably-scoped ones.
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   REGISTRY_URL          Protected          — base URL of the private
#                         dependably instance, e.g. https://dependably.northwardlabs.ca/
#   REGISTRY_PUBLISH_KEY  Protected + Masked — publish:npm token (the publish PUT)
#   REGISTRY_KEY          Unprotected + Masked — read-only token (installs, read-back)
#   DEPENDABLY_SBOM_TOKEN Masked — token with the sbom:upload capability, for
#                         sbom-publish-dependably against REGISTRY_URL
#   dependencyTrack_url   Protected          — Dependency-Track base URL, e.g.
#                         https://dtrack.example.com
#   dependencyTrack_token Protected + Masked — DT API key with BOM_UPLOAD +
#                         PROJECT_CREATION_UPLOAD perms
#   SONAR_HOST_URL        — SonarQube server URL (sonarqube-check)
#   SONAR_TOKEN           Masked — SonarQube analysis token (sonarqube-check)
#   GITHUB_TOKEN          Protected + Masked — contents:write on the GitHub
#                         mirror (publish:github)

# Run ONE pipeline per change: a merge-request pipeline when an MR is open (so
# the full suite gates the MR, not a redundant branch pipeline), the branch
# pipeline on main, and tag pipelines.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  auto_cancel:
    on_new_commit: interruptible

default:
  image: node:22
  interruptible: true

stages:
  - test
  - build
  - sbom
  - sbom-publish
  - publish

# Wires REGISTRY_URL + REGISTRY_KEY (project CI/CD variables) into npm so `npm
# ci`/`npm install`/`npx` route through the private dependably instance instead
# of the public registry — package-lock.json's `resolved` entries already point
# there (dev machines default to it), so this isn't optional plumbing, it's what
# makes installs resolve at all. HARD-FAILS when either var is empty rather than
# silently falling back to public. Overwrites the project-root .npmrc for the
# duration of the job (it's a fresh checkout each time — never persisted back);
# doing it at project level, not $HOME, so it reliably wins over the committed
# .npmrc's @dependably-scope line rather than racing it on precedence.
.private-registry-setup:
  before_script:
    - |
      if [ -z "${REGISTRY_URL:-}" ] || [ -z "${REGISTRY_KEY:-}" ]; then
        echo "ERROR: REGISTRY_URL/REGISTRY_KEY are empty — refusing to install from the public registry." >&2
        echo "Both must be set as CI/CD variables (Settings > CI/CD > Variables)." >&2
        exit 1
      fi
      HOST=$(printf '%s' "$REGISTRY_URL" | sed -E 's|^https?://||; s|/.*||')
      printf 'registry=%s/npm/\n//%s/npm/:_authToken=%s\nalways-auth=true\nfund=false\n' \
        "$REGISTRY_URL" "$HOST" "$REGISTRY_KEY" > .npmrc
      ACTIVE=$(npm config get registry)
      case "$ACTIVE" in *npmjs.org*) echo "ERROR: npm still resolved to the public registry ($ACTIVE)." >&2; exit 1 ;; esac
      echo "npm registry → $ACTIVE"
    - npm ci --cache .npm --prefer-offline
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

test:
  stage: test
  extends: .private-registry-setup
  script:
    - npm test

# Dogfoods our own supply-chain checker against our own lockfile. Deliberately
# does NOT extend .private-registry-setup: that template overwrites .npmrc with
# the resolved REGISTRY_KEY in plaintext, which is exactly what npm-check's own
# valid-npmrc rule flags as a supply-chain anti-pattern — it would be auditing a
# file we just made non-compliant. This job only needs the @dependably scope
# (already mapped in the committed .npmrc via `${DEPENDABLY_TOKEN}`, an env-var
# reference, not a literal secret) to resolve npm-check itself via npx; no
# `npm ci` of our own deps is needed to lint a static lockfile.
npm-check:
  stage: test
  script:
    - |
      if [ -z "${REGISTRY_KEY:-}" ]; then
        echo "ERROR: REGISTRY_KEY must be set as a CI/CD variable (used here as DEPENDABLY_TOKEN for the @dependably scope)." >&2
        exit 1
      fi
    - DEPENDABLY_TOKEN="$REGISTRY_KEY" npx -y @dependably/npm-check@1.8.0 audit package-lock.json

# SonarQube analysis on the default branch. Advisory (allow_failure:true): with
# sonar.qualitygate.wait=true the scanner exits non-zero on a red quality gate,
# and the pipeline shows it without blocking. Needs SONAR_HOST_URL and
# SONAR_TOKEN (masked) as CI/CD variables; the job is skipped when the token is
# absent rather than failing on every main pipeline.
sonarqube-check:
  stage: test
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $SONAR_TOKEN'

# Mirror to the public GitHub repository (github.com/dependably/dependably-mcp),
# same shape as dependably-documentation's publish:github. Manual: a main push
# mirrors main; a vX.Y.Z tag pipeline mirrors that tag, which is what triggers
# the GitHub workflow's public npm publish and release-bundle jobs. Needs a
# GITHUB_TOKEN CI/CD variable (masked) with contents:write on the mirror.
publish:github:
  stage: publish
  image: alpine/git:latest
  interruptible: false
  resource_group: github-mirror
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - '[ -n "$GITHUB_TOKEN" ] || { echo "GITHUB_TOKEN not set in CI/CD variables" >&2; exit 1; }'
    - git remote add github "https://x-access-token:${GITHUB_TOKEN}@github.com/dependably/dependably-mcp.git"
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        echo "Mirroring tag $CI_COMMIT_TAG ($CI_COMMIT_SHA) to github.com/dependably/dependably-mcp"
        git push github "$CI_COMMIT_SHA:refs/heads/main"
        git push github "refs/tags/$CI_COMMIT_TAG:refs/tags/$CI_COMMIT_TAG"
      else
        echo "Mirroring $CI_COMMIT_SHA to github.com/dependably/dependably-mcp main"
        git push github HEAD:refs/heads/main
      fi

build:
  stage: build
  extends: .private-registry-setup
  script:
    - npm run build
    - npm pack
    # Claude Desktop extension: dist-mcpb/dependably-<version>.mcpb + .sha256,
    # built from the same checkout as the tarball and booted once from the
    # unpacked bundle to prove it is self-contained. Same version, same tag.
    - apt-get update -qq && apt-get install -y -qq unzip > /dev/null
    - npm run bundle:verify
    - echo "BUILD_JOB_ID=$CI_JOB_ID" > build.env
  artifacts:
    paths:
      - "*.tgz"
      - dist-mcpb/
    reports:
      dotenv: build.env
    expire_in: 1 week

# Software Bill of Materials (CycloneDX 1.6) and package-level reachability,
# both produced by our own sbom-reach (gitlab.northwardlabs.ca/moonlitlabs/
# sbom-reachability) in generate mode: it builds the SBOM from package-lock.json
# with the dev/runtime marker explicit on every component, asks OSV.dev for
# advisories, and follows first-party imports through node_modules (installed
# by .private-registry-setup) to say which vulnerable packages are actually
# reached. Two artefacts: sbom.json (with vulnerabilities[] embedded) for the
# SBOM uploads, sbom-reach.sarif for Dependably's SARIF ingest, which writes
# reachability facts and the dev/prod signal onto the components.
#
# Installing sbom-reach: it publishes to the private Dependably npm registry
# (sbom-reachability's docs/releasing.md; 0.2.2 was the first release), so
# `SBOM_REACH_VERSION` resolves through the same private proxy every other npm
# install here uses. Pinned exactly, like npm-check below; bump deliberately.
#
# --fail-on none: generation and gating are separate concerns. The verdicts
# go to Dependably, whose policy decides; the summary table on stderr still
# shows what is reachable. The SBOM itself is unchanged by that flag.
sbom:
  stage: sbom
  extends: .private-registry-setup
  variables:
    SBOM_REACH_VERSION: "0.2.2"
  script:
    - |
      set -eu
      TOOL_DIR="$CI_PROJECT_DIR/.sbom-reach"
      mkdir -p "$TOOL_DIR"
      # npm scopes its project config to the nearest package.json, so the
      # private-registry .npmrc the setup wrote at the repo root must travel.
      cp .npmrc "$TOOL_DIR/.npmrc"
      cd "$TOOL_DIR"
      # Not `npm init -y`: it names the package after the directory, and a
      # leading dot is an invalid package name, so it exits 1.
      printf '{ "name": "sbom-reach-runner", "private": true }\n' > package.json
      echo "Installing sbom-reach@$SBOM_REACH_VERSION from the registry"
      npm install --no-audit --no-fund "sbom-reach@$SBOM_REACH_VERSION"
      cd "$CI_PROJECT_DIR"
      SBOM_REACH="$TOOL_DIR/node_modules/.bin/sbom-reach"
      "$SBOM_REACH" --version
      "$SBOM_REACH" analyze --src . --vuln-source osv \
        --sbom-output sbom.json --sarif-category sbom-reach -o sbom-reach.sarif --fail-on none
      test -s sbom.json && test -s sbom-reach.sarif
  artifacts:
    paths:
      - sbom.json
      - sbom-reach.sarif
    expire_in: 30 days

# Publish the SBOM to Dependency-Track for continuous supply-chain monitoring.
# Default branch only. Runs in its own stage after `sbom` and consumes that
# job's artifact (alpine:3 + curl, mirrors checker-npm's sbom-publish job).
#
# Text fields use `--form-string`, not `-F`: in a curl `-F` value, a leading
# `@` means "read this file", which would misfire if the project/package name
# ever gained an `@scope/` prefix. `--form-string` sends values verbatim with
# no @/< interpretation; only the actual file upload keeps `-F "bom=@sbom.json"`.
#
# autoCreate stands the project up on first upload; projectVersion tracks the
# package.json version (read with sed since the alpine image has no node) so
# each release is a distinct BOM. Hard-fails when the Dependency-Track
# variables aren't configured, mirroring `publish`'s REGISTRY_* guard.
sbom-publish:
  stage: sbom-publish
  image: alpine:3
  # External write (uploads the BOM to Dependency-Track) — never auto-cancel mid-upload.
  interruptible: false
  needs:
    - job: sbom
      artifacts: true
  resource_group: sbom-publish
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - apk add --no-cache curl
    - |
      if [ -z "$dependencyTrack_url" ] || [ -z "$dependencyTrack_token" ]; then
        echo "ERROR: dependencyTrack_url and dependencyTrack_token must be set as CI/CD variables." >&2
        exit 1
      fi
    - |
      set -eu
      if [ ! -s sbom.json ]; then
        echo "ERROR: sbom.json (from the sbom job artifact) is missing. Directory contents:" >&2
        ls -la >&2
        exit 1
      fi
      BASE="${dependencyTrack_url%/}"
      PROJECT="dependably-mcp"
      VERSION=$(sed -n 's/^[[:space:]]*"version": *"\([^"]*\)".*/\1/p' package.json | head -n1)
      if [ -z "$VERSION" ]; then
        echo "ERROR: could not determine version from package.json." >&2
        exit 1
      fi
      echo "Publishing SBOM ($(wc -c < sbom.json) bytes) for $PROJECT@$VERSION to $BASE"
      status=$(curl -sS -o /tmp/bom.out -w '%{http_code}' \
        -X POST "$BASE/api/v1/bom" \
        -H "X-Api-Key: $dependencyTrack_token" \
        --form-string "autoCreate=true" \
        --form-string "projectName=$PROJECT" \
        --form-string "projectVersion=$VERSION" \
        -F "bom=@sbom.json")
      case "$status" in
        200) echo "✓ SBOM uploaded";;
        *) echo "SBOM upload failed (HTTP $status):" >&2; cat /tmp/bom.out >&2; exit 1;;
      esac

# Publish the SBOM and the reachability SARIF to the Dependably instance's
# Projects page (the product dogfooding its own intake), alongside Dependency-
# Track. SBOM first: PUT /api/v1/sbom with the CycloneDX JSON as the raw body
# and the target in the query string (SbomController.PutSbom in
# dependably-community): autoCreate stands the project and version up on first
# upload, isLatest promotes it. Both success paths answer 200; a re-upload of
# the same version is a merge, not a duplicate. Then PUT /api/v1/sarif against
# the same version, which writes reachability facts and the dev/prod signal. Authenticates with DEPENDABLY_SBOM_TOKEN, a token minted with the
# "SBOM upload" scope (the endpoint checks the `sbom:upload` capability, which
# the npm push and pull tokens do not carry). Targets REGISTRY_URL. Hard-fails
# when unconfigured, like sbom-publish.
sbom-publish-dependably:
  stage: sbom-publish
  image: alpine:3
  # External write — never auto-cancel mid-upload.
  interruptible: false
  needs:
    - job: sbom
      artifacts: true
  resource_group: sbom-publish-dependably
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - apk add --no-cache curl
    - |
      if [ -z "${REGISTRY_URL:-}" ] || [ -z "${DEPENDABLY_SBOM_TOKEN:-}" ]; then
        echo "ERROR: REGISTRY_URL and DEPENDABLY_SBOM_TOKEN must be set as CI/CD variables." >&2
        echo "       If DEPENDABLY_SBOM_TOKEN is Protected and still empty here, this ref is not protected." >&2
        exit 1
      fi
    - |
      set -eu
      if [ ! -s sbom.json ]; then
        echo "ERROR: sbom.json (from the sbom job artifact) is missing." >&2
        exit 1
      fi
      BASE="${REGISTRY_URL%/}"
      PROJECT="dependably-mcp"
      VERSION=$(sed -n 's/^[[:space:]]*"version": *"\([^"]*\)".*/\1/p' package.json | head -n1)
      if [ -z "$VERSION" ]; then
        echo "ERROR: could not determine version from package.json." >&2
        exit 1
      fi
      echo "Publishing SBOM ($(wc -c < sbom.json) bytes) for $PROJECT@$VERSION to $BASE/api/v1/sbom"
      status=$(curl -sS -o /tmp/sbom.out -w '%{http_code}' \
        -X PUT "$BASE/api/v1/sbom?projectName=$PROJECT&projectVersion=$VERSION&autoCreate=true&isLatest=true" \
        -H "Authorization: Bearer $DEPENDABLY_SBOM_TOKEN" \
        -H "Content-Type: application/json" \
        -H "Accept: application/json, application/problem+json" \
        --data-binary @sbom.json)
      case "$status" in
        200) echo "✓ SBOM uploaded to Dependably:"; cat /tmp/sbom.out; echo;;
        403) echo "SBOM upload to Dependably refused (HTTP 403): DEPENDABLY_SBOM_TOKEN lacks the sbom:upload capability. Mint it with the SBOM upload scope in Dependably (Tokens)." >&2; cat /tmp/sbom.out >&2; exit 1;;
        *) echo "SBOM upload to Dependably failed (HTTP $status):" >&2; cat /tmp/sbom.out >&2; exit 1;;
      esac
      # Reachability + dev/prod signal for the version the SBOM just created.
      # Same target, PUT /api/v1/sarif; must follow the SBOM, since only an SBOM
      # upload creates a project version.
      if [ ! -s sbom-reach.sarif ]; then
        echo "ERROR: sbom-reach.sarif (from the sbom job artifact) is missing." >&2
        exit 1
      fi
      echo "Publishing reachability SARIF ($(wc -c < sbom-reach.sarif) bytes) for $PROJECT@$VERSION to $BASE/api/v1/sarif"
      status=$(curl -sS -o /tmp/sarif.out -w '%{http_code}' \
        -X PUT "$BASE/api/v1/sarif?projectName=$PROJECT&projectVersion=$VERSION" \
        -H "Authorization: Bearer $DEPENDABLY_SBOM_TOKEN" \
        -H "Content-Type: application/json" \
        -H "Accept: application/json, application/problem+json" \
        --data-binary @sbom-reach.sarif)
      case "$status" in
        200) echo "✓ SARIF uploaded to Dependably:"; cat /tmp/sarif.out; echo;;
        *) echo "SARIF upload to Dependably failed (HTTP $status):" >&2; cat /tmp/sarif.out >&2; exit 1;;
      esac

publish:
  stage: publish
  # External write (pushes the tarball to the registry) — never auto-cancel it.
  interruptible: false
  # Only the build artifact is needed — no source install, and publishing a
  # prebuilt tarball deliberately skips `prepublishOnly` (which re-runs the
  # full suite). The `test` stage above is the authoritative quality gate.
  dependencies:
    - build
  # Manual approval on a version tag. Serialize so two publishes can't race.
  resource_group: publish
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
      allow_failure: false
  script:
    - |
      # Split by capability: REGISTRY_PUBLISH_KEY (protected + masked, publish:npm)
      # authenticates the PUT; REGISTRY_KEY (unprotected, scoped read-only on the
      # registry) authenticates the read-back. The read token cannot publish, so it
      # is not accepted as a fallback here.
      if [ -z "$REGISTRY_URL" ] || [ -z "$REGISTRY_PUBLISH_KEY" ] || [ -z "$REGISTRY_KEY" ]; then
        echo "ERROR: REGISTRY_URL, REGISTRY_PUBLISH_KEY and REGISTRY_KEY must all be set as CI/CD variables." >&2
        echo "       REGISTRY_PUBLISH_KEY must be Protected + Masked; if it is set and still" >&2
        echo "       empty here, this ref is not protected (add 'v*' to Protected Tags)." >&2
        exit 1
      fi
    - REGISTRY_HOST=$(printf '%s' "$REGISTRY_URL" | sed -E 's#^https?://##; s#/+$##')
    # REGISTRY_URL is the instance BASE url; the npm registry lives under /npm/
    # (same suffix .private-registry-setup appends). Publishing to the bare host
    # PUTs into the SPA/API fallback and 405s (job #68222), and the authToken
    # nerf-dart must carry the same /npm/ path or npm won't attach the token.
    - NPM_REGISTRY="${REGISTRY_URL%/}/npm/"
    # Neutralize the committed .npmrc: its ${DEPENDABLY_TOKEN} env reference
    # hard-fails npm when the var is unset, and this job (artifact-only) never
    # runs .private-registry-setup to overwrite it.
    - printf 'registry=%s\nfund=false\n' "$NPM_REGISTRY" > .npmrc
    - |
      {
        echo "//$REGISTRY_HOST/npm/:_authToken=$REGISTRY_PUBLISH_KEY"
        echo "always-auth=true"
      } > .npmrc.publish
    - |
      {
        echo "//$REGISTRY_HOST/npm/:_authToken=$REGISTRY_KEY"
        echo "always-auth=true"
      } > .npmrc.read
    - TARBALL=$(ls ./*.tgz)
    - PKG=$(node -p "const p=require('./package.json'); p.name + '@' + p.version")
    - echo "Publishing $TARBALL ($PKG) to $NPM_REGISTRY"
    - npm publish "$TARBALL" --registry "$NPM_REGISTRY" --userconfig "$CI_PROJECT_DIR/.npmrc.publish"
    # Read-back with the READ token: REGISTRY_PUBLISH_KEY carries publish:npm, not a
    # read capability, and verifying with the credential you just wrote with is a
    # weaker check than verifying with the one consumers actually use.
    - echo "Verifying $PKG is live on the registry…"
    - npm view "$PKG" version --registry "$NPM_REGISTRY" --userconfig "$CI_PROJECT_DIR/.npmrc.read"
    - echo "✓ $PKG published and verified on $NPM_REGISTRY"
  after_script:
    - rm -f .npmrc.publish .npmrc.read

# GitLab release on a vX.Y.Z tag: attaches the extension bundle and its checksum
# from the tag pipeline's `build` job, so a Desktop user has a stable download
# URL per version. Runs automatically (no external write beyond this project);
# the npm publish above stays a manual gate.
release:
  stage: publish
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  interruptible: false
  needs:
    - job: build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  variables:
    ARTIFACT_BASE: "$CI_PROJECT_URL/-/jobs/$BUILD_JOB_ID/artifacts/raw/dist-mcpb"
  script:
    - |
      set -eu
      VERSION="${CI_COMMIT_TAG#v}"
      if [ ! -f "dist-mcpb/dependably-$VERSION.mcpb" ]; then
        echo "ERROR: bundle for $VERSION missing from build artifacts" >&2
        exit 1
      fi
      echo "Releasing $CI_COMMIT_TAG with dependably-$VERSION.mcpb"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "dependably-mcp $CI_COMMIT_TAG"
    description: "See CHANGELOG.md for this release. The Claude Desktop extension is attached; verify it against the .sha256 before installing."
    assets:
      links:
        - name: "dependably-${CI_COMMIT_TAG#v}.mcpb (Claude Desktop extension)"
          url: "$ARTIFACT_BASE/dependably-${CI_COMMIT_TAG#v}.mcpb"
          link_type: package
        - name: "dependably-${CI_COMMIT_TAG#v}.mcpb.sha256"
          url: "$ARTIFACT_BASE/dependably-${CI_COMMIT_TAG#v}.mcpb.sha256"
          link_type: other

# Internal-testing publish: manual gate on the default branch, pushing to the
# private dependably registry (mirrors the cslint / checker-python main-branch
# publish jobs). npm has no equivalent of NuGet's --skip-duplicate and registry
# versions are immutable, so publishing main's plain version would burn the
# next release number; instead every run publishes a unique prerelease —
# <version>-dev.<pipeline-iid>.<short-sha> — under the `dev` dist-tag, so
# `npm install dependably-mcp` (latest) never resolves to an internal build.
# Consume with:
#   npm install dependably-mcp@dev --registry https://dependably.northwardlabs.ca/npm/
# The version bump happens only in this job's checkout; nothing is committed.
# Unlike `publish`, this builds its own tarball (it must re-pack with the dev
# version), so it extends .private-registry-setup for the devDependency install.
publish-dev:
  stage: publish
  extends: .private-registry-setup
  # External write (pushes the tarball to the registry) — never auto-cancel it.
  interruptible: false
  resource_group: publish
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
  script:
    - |
      BASE=$(node -p "require('./package.json').version")
      DEV_VERSION="${BASE}-dev.${CI_PIPELINE_IID}.${CI_COMMIT_SHORT_SHA}"
      npm version "$DEV_VERSION" --no-git-tag-version
      echo "Internal test version: $DEV_VERSION"
    - npm run build
    - TARBALL=$(npm pack | tail -1)
    - REGISTRY_HOST=$(printf '%s' "$REGISTRY_URL" | sed -E 's#^https?://##; s#/+$##')
    # The npm registry lives under /npm/, not at the instance base URL — a PUT
    # to the bare host hits the SPA/API fallback and 405s (job #68222). The
    # authToken nerf-dart must carry the same /npm/ path to match.
    - NPM_REGISTRY="${REGISTRY_URL%/}/npm/"
    - |
      : "${REGISTRY_PUBLISH_KEY:?must be set as a Protected + Masked CI/CD variable; if it is set and still empty here, this ref is not protected}"
      # This job extends .private-registry-setup, which wrote a PROJECT-level .npmrc
      # carrying the READ token so `npm ci` could resolve devDependencies. npm reads
      # project config ahead of --userconfig, so leaving that token in place would
      # override the publish credential below and send the read token on the PUT —
      # silently, and only failing once the read token lost its write scope.
      # Strip the credential now that the install is done; the registry line stays so
      # the publish still targets the private instance.
      printf 'registry=%s\nfund=false\n' "$NPM_REGISTRY" > .npmrc
    - |
      {
        echo "//$REGISTRY_HOST/npm/:_authToken=$REGISTRY_PUBLISH_KEY"
        echo "always-auth=true"
      } > .npmrc.publish
    - |
      {
        echo "//$REGISTRY_HOST/npm/:_authToken=$REGISTRY_KEY"
        echo "always-auth=true"
      } > .npmrc.read
    - PKG=$(node -p "const p=require('./package.json'); p.name + '@' + p.version")
    - echo "Publishing $TARBALL ($PKG, dist-tag dev) to $NPM_REGISTRY"
    - npm publish "$TARBALL" --tag dev --registry "$NPM_REGISTRY" --userconfig "$CI_PROJECT_DIR/.npmrc.publish"
    - echo "Verifying $PKG is live on the registry…"
    - npm view "$PKG" version --registry "$NPM_REGISTRY" --userconfig "$CI_PROJECT_DIR/.npmrc.read"
    - echo "✓ $PKG published (dist-tag dev) and verified on $NPM_REGISTRY"
  after_script:
    - rm -f .npmrc.publish .npmrc.read
