# SonarQube analysis configuration for dependably-mcp.
#
# Non-secret structural settings live here. SONAR_HOST_URL and SONAR_TOKEN come
# from CI/CD variables and are read by the scanner from the environment in the
# `sonarqube-check` job (.gitlab-ci.yml).
sonar.projectKey=moonlitlabs_dependably-mcp_AaCZoOMFkamVCgS88TWn
sonar.projectName=dependably-mcp

# Block on the server-side quality gate. The CI job is allow_failure:true, so a
# red gate shows on the pipeline without blocking it.
sonar.qualitygate.wait=true

# TypeScript sources; the unit tests, smoke test and build scripts are declared as tests.
sonar.sources=src
sonar.tests=test,scripts

# Coverage comes from `npm run test:unit`, which runs node --test with
# --enable-source-maps so V8 coverage of dist/*.js is remapped onto the
# src/*.ts files Sonar actually analyses. Without that flag every SF: line
# names dist/*.js, which sonar.sources excludes, and the project reads 0%.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.exclusions=node_modules/**,dist/**,coverage/**,dist-mcpb/**,build/**,.npm/**,.sonar/**,.sbom-reach/**
sonar.sourceEncoding=UTF-8
